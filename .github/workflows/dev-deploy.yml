name: Dev Deployment
on:
  workflow_dispatch:
    inputs:
      ref:
        description: 'Git ref (branch, tag, or SHA) to deploy (defaults to main)'
        required: false
        default: 'main'
  issue_comment:
    types: [created]

permissions:
  pull-requests: write
  deployments: write
  contents: write
  checks: read
  statuses: read

jobs:
  dev-deploy:
    if: ${{ github.event_name == 'workflow_dispatch' || (github.event_name == 'issue_comment' && github.event.issue.pull_request) }}
    runs-on: ubuntu-latest
    environment: development
    steps:
      - name: branch-deploy
        id: branch-deploy
        if: ${{ github.event_name == 'issue_comment' }}
        uses: github/branch-deploy@v11.0.0
        with:
          trigger: '.deploy'
          reaction: 'eyes'
          environment: 'development'
          stable_branch: 'main'
          environment_urls: 'production|disabled,development|https://dev.genji.pk,staging|disabled'
          environment_targets: 'development'
          allow_forks: 'true'
          admins: 'tylovejoy,Aiapaec64'
          update_branch: 'disabled'

      - name: Checkout repository (PR comment)
        if: ${{ github.event_name == 'issue_comment' }}
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.branch-deploy.outputs.sha }}

      # Checkout for manual dispatch flow (uses input ref; defaults to main)
      - name: Checkout repository (manual dispatch)
        if: ${{ github.event_name == 'workflow_dispatch' }}
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}

      - name: Set up SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SERVER_HOST_SSH_PRIVATE_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa

      - name: Add remote host to known_hosts
        run: |
          ssh-keyscan -H ${{ secrets.SERVER_HOST_IP }} >> ~/.ssh/known_hosts

      - name: Set up Docker context for dev
        run: |
          docker context create dev-server \
            --docker "host=ssh://${{ secrets.SERVER_HOST_USER }}@${{ secrets.SERVER_HOST_IP }}" \
            --description "Dev server context"
          docker context use dev-server

      - name: Deploy to Remote Dev Server
        run: |
          echo "Deploying to Dev Server..."

          docker compose -f docker-compose.dev.yml up -d --build --no-deps --force-recreate

        env:
          APP_ENV: ${{ secrets.APP_ENV }}
          APP_DEBUG: ${{ secrets.APP_DEBUG }}
          APP_URL: ${{ secrets.APP_URL }}
          APP_KEY: ${{ secrets.APP_KEY }}
          LOG_CHANNEL: ${{ secrets.LOG_CHANNEL }}
          LOG_STACK: ${{ secrets.LOG_STACK }}
          LOG_DEPRECATIONS_CHANNEL: ${{ secrets.LOG_DEPRECATIONS_CHANNEL }}
          LOG_LEVEL: ${{ secrets.LOG_LEVEL }}
          X_API_ROOT: ${{ secrets.X_API_ROOT }}
          X_API_VERIFY: ${{ secrets.X_API_VERIFY }}
          X_API_KEY: ${{ secrets.X_API_KEY }}
          DISCORD_CLIENT_ID: ${{ secrets.DISCORD_CLIENT_ID }}
          DISCORD_CLIENT_SECRET: ${{ secrets.DISCORD_CLIENT_SECRET }}
          DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
          DISCORD_GUILD_ID: ${{ secrets.DISCORD_GUILD_ID }}
          DISCORD_MODERATOR_ROLE_IDS: ${{ secrets.DISCORD_MODERATOR_ROLE_IDS }}
          TENOR_API_KEY: ${{ secrets.TENOR_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TRANSLATION_API_ROOT: ${{ secrets.TRANSLATION_API_ROOT }}
          TRANSLATION_API_KEY: ${{ secrets.TRANSLATION_API_KEY }}
          TRANSLATION_API_VERIFY: ${{ secrets.TRANSLATION_API_VERIFY }}
          SENTRY_ENVIRONMENT: ${{ secrets.SENTRY_ENVIRONMENT }}
          SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
          SENTRY_TUNNEL_ALLOWED_DSN: ${{ secrets.SENTRY_TUNNEL_ALLOWED_DSN }}
          SENTRY_TRACES_SAMPLE_RATE: ${{ secrets.SENTRY_TRACES_SAMPLE_RATE }}
          SENTRY_PROFILES_SAMPLE_RATE: ${{ secrets.SENTRY_PROFILES_SAMPLE_RATE }}
          VITE_APP_ENV: ${{ secrets.VITE_APP_ENV }}
          VITE_APP_RELEASE: ${{ secrets.VITE_APP_RELEASE }}
          VITE_SENTRY_DSN: ${{ secrets.VITE_SENTRY_DSN }}
          SESSION_SECURE_COOKIE: ${{ secrets.SESSION_SECURE_COOKIE }}
          SESSION_DOMAIN: ${{ secrets.SESSION_DOMAIN }}
          BATTLENET_CLIENT_ID: ${{ BATTLENET_CLIENT_ID }}
          BATTLENET_CLIENT_SECRET: ${{ BATTLENET_CLIENT_SECRET }}
